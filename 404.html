<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | Vinod Suthar</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/jpeg" href="images/vk-logo.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:          #0E1116;
      --surface:     #161B22;
      --border:      #262D37;
      --text:        #E6EDF3;
      --muted:       #8B949E;
      --accent:      #FF4433;
      --accent-soft: rgba(255,68,51,0.12);
      --green:       #3FB950;
      --blue:        #79C0FF;
      --yellow:      #FFA657;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* ── Grid lines background ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 52px 52px;
      opacity: 0.25;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Particles ── */
    .particles { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .particle {
      position: absolute;
      border-radius: 50%;
      animation: floatUp linear infinite;
    }
    @keyframes floatUp {
      0%   { transform: translateY(110vh); opacity: 0; }
      10%  { opacity: 0.18; }
      90%  { opacity: 0.1; }
      100% { transform: translateY(-10vh); opacity: 0; }
    }

    /* ── Page wrapper ── */
    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }

    /* ── Two-column layout ── */
    .split {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 60px;
      max-width: 1100px;
      width: 100%;
    }

    /* LEFT — SVG */
    .col-left {
      flex: 0 0 380px;
      max-width: 380px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .scene {
      width: 100%;
      max-width: 360px;
      filter: drop-shadow(0 0 40px rgba(255,68,51,0.18));
    }

    /* RIGHT — Text */
    .col-right {
      flex: 1;
      min-width: 0;
      max-width: 480px;
    }

    /* ── Typography ── */
    .error-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      color: var(--accent);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255,68,51,0.5); }
      50%       { box-shadow: 0 0 0 6px rgba(255,68,51,0); }
    }

    .error-code {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(4.5rem, 12vw, 7.5rem);
      font-weight: 700;
      line-height: 1;
      background: linear-gradient(135deg, var(--accent) 0%, var(--blue) 50%, var(--accent) 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientShift 3s linear infinite;
      margin-bottom: 12px;
      display: block;
    }
    @keyframes gradientShift {
      to { background-position: 200% center; }
    }

    h1 {
      font-family: 'Sora', sans-serif;
      font-size: clamp(1.35rem, 3vw, 1.85rem);
      font-weight: 700;
      color: var(--text);
      margin-bottom: 10px;
      line-height: 1.3;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.97rem;
      line-height: 1.75;
      margin-bottom: 28px;
    }

    /* ── JSON card ── */
    .json-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      line-height: 1.9;
      color: var(--muted);
      margin-bottom: 28px;
    }
    .jk { color: var(--blue); }
    .js { color: var(--green); }
    .jn { color: var(--accent); }
    .jp { color: var(--muted); }

    /* ── Buttons ── */
    .btn-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 24px;
      border-radius: 10px;
      font-family: 'Inter', sans-serif;
      font-size: 0.92rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
      border: none;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover {
      background: #e33a2c;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(255,68,51,0.3);
    }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-outline:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
      transform: translateY(-2px);
    }

    /* ── SVG Animations ── */
    #astronaut      { animation: float 4s ease-in-out infinite; transform-origin: 170px 155px; }
    @keyframes float {
      0%,100% { transform: translateY(0)    rotate(0deg);  }
      30%     { transform: translateY(-14px) rotate(2.5deg); }
      70%     { transform: translateY(-7px)  rotate(-2deg); }
    }

    #visorGlare     { animation: visorBlink 3.5s ease-in-out infinite; }
    @keyframes visorBlink {
      0%,78%,100% { opacity: 0.45; }
      80%          { opacity: 0.08; }
      85%          { opacity: 0.45; }
      90%          { opacity: 0.08; }
      95%          { opacity: 0.45; }
    }

    .star           { animation: twinkle ease-in-out infinite; }
    @keyframes twinkle {
      0%,100% { opacity: 1; }
      50%     { opacity: 0.15; }
    }

    #orbitRing      { animation: spinRing 7s linear infinite; transform-origin: 170px 278px; }
    @keyframes spinRing { to { transform: rotate(360deg); } }

    #satellite      { animation: orbitSat 5.5s linear infinite; transform-origin: 170px 155px; }
    @keyframes orbitSat { to { transform: rotate(360deg); } }

    #glitchTxt      { animation: glitch 5s steps(1) infinite; }
    @keyframes glitch {
      0%,88%,100% { transform: translate(0);        opacity: 0.7; }
      89%          { transform: translate(-4px,1px);  opacity: 0.5; }
      90%          { transform: translate(4px,-1px);  opacity: 0.5; }
      91%          { transform: translate(0);        opacity: 0.7; }
    }

    #flame1 { animation: flame 0.28s ease-in-out infinite alternate; transform-origin: 159px 196px; }
    #flame2 { animation: flame 0.28s ease-in-out 0.14s infinite alternate; transform-origin: 181px 196px; }
    @keyframes flame {
      from { transform: scaleY(1)   scaleX(1);    opacity: 0.85; }
      to   { transform: scaleY(1.4) scaleX(0.75); opacity: 1;    }
    }

    #antennaDot { animation: twinkle 0.9s ease-in-out infinite; }

    /* ── Responsive ── */
    @media (max-width: 860px) {
      .split {
        flex-direction: column;
        gap: 32px;
        text-align: center;
      }
      .col-left  { flex: unset; max-width: 280px; width: 100%; }
      .col-right { max-width: 100%; }
      .btn-row   { justify-content: center; }
      .error-label { justify-content: center; }
    }
  </style>
</head>
<body>

  <div class="particles" id="particles"></div>

  <div class="page">
    <div class="split">

      <!-- ═══════════════ LEFT — SVG ═══════════════ -->
      <div class="col-left">
        <svg class="scene" viewBox="0 0 340 320" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
              <stop offset="0%"   stop-color="#FF4433" stop-opacity="0.1"/>
              <stop offset="100%" stop-color="#0E1116" stop-opacity="0"/>
            </radialGradient>
            <radialGradient id="planetGrad" cx="38%" cy="32%" r="65%">
              <stop offset="0%"   stop-color="#2a4575"/>
              <stop offset="100%" stop-color="#0c1c3a"/>
            </radialGradient>
            <radialGradient id="visorGrad" cx="35%" cy="28%" r="72%">
              <stop offset="0%"   stop-color="#b8e0f5"/>
              <stop offset="100%" stop-color="#2e7db5"/>
            </radialGradient>
            <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
              <feGaussianBlur stdDeviation="2.5" result="blur"/>
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>

          <!-- Ambient glow -->
          <ellipse cx="170" cy="175" rx="150" ry="120" fill="url(#bgGlow)"/>

          <!-- Stars -->
          <circle class="star" cx="28"  cy="35"  r="2"   fill="#E6EDF3" style="animation-duration:2.1s;animation-delay:0s"/>
          <circle class="star" cx="308" cy="22"  r="1.5" fill="#79C0FF" style="animation-duration:1.7s;animation-delay:.4s"/>
          <circle class="star" cx="295" cy="88"  r="2"   fill="#E6EDF3" style="animation-duration:2.5s;animation-delay:.8s"/>
          <circle class="star" cx="48"  cy="125" r="1.5" fill="#FFA657" style="animation-duration:1.9s;animation-delay:.2s"/>
          <circle class="star" cx="318" cy="195" r="2"   fill="#E6EDF3" style="animation-duration:2.3s;animation-delay:1.1s"/>
          <circle class="star" cx="14"  cy="218" r="1.5" fill="#79C0FF" style="animation-duration:1.6s;animation-delay:.6s"/>
          <circle class="star" cx="255" cy="308" r="2"   fill="#E6EDF3" style="animation-duration:2.0s;animation-delay:.3s"/>
          <circle class="star" cx="78"  cy="298" r="1.5" fill="#FFA657" style="animation-duration:2.2s;animation-delay:.9s"/>
          <circle class="star" cx="198" cy="18"  r="1.5" fill="#3FB950" style="animation-duration:1.8s;animation-delay:.5s"/>
          <circle class="star" cx="138" cy="308" r="2"   fill="#E6EDF3" style="animation-duration:2.4s;animation-delay:.7s"/>

          <!-- Planet -->
          <circle cx="170" cy="278" r="40" fill="url(#planetGrad)" stroke="#262D37" stroke-width="1.5"/>
          <ellipse cx="158" cy="270" rx="13" ry="5.5" fill="#1a3868" opacity="0.55"/>
          <ellipse cx="183" cy="283" rx="9"  ry="4"   fill="#1a3868" opacity="0.45"/>
          <ellipse cx="153" cy="287" rx="6"  ry="2.5" fill="#1a3868" opacity="0.38"/>
          <ellipse cx="153" cy="263" rx="9"  ry="5.5" fill="white"   opacity="0.05"/>

          <!-- Orbit ring -->
          <g id="orbitRing">
            <ellipse cx="170" cy="278" rx="60" ry="15"
                     fill="none" stroke="#FF4433" stroke-width="1.5"
                     stroke-dasharray="7 4" opacity="0.55"/>
            <circle cx="230" cy="278" r="4.5" fill="#FF4433" filter="url(#glow)"/>
          </g>

          <!-- ── Astronaut ── -->
          <g id="astronaut">
            <!-- Jetpack -->
            <rect x="151" y="165" width="13" height="22" rx="4" fill="#1C232C" stroke="#262D37" stroke-width="1.5"/>
            <rect x="176" y="165" width="13" height="22" rx="4" fill="#1C232C" stroke="#262D37" stroke-width="1.5"/>
            <!-- Flames -->
            <ellipse id="flame1" cx="157.5" cy="192" rx="4" ry="6" fill="#FF4433" opacity="0.9"/>
            <ellipse id="flame2" cx="182.5" cy="192" rx="4" ry="6" fill="#FFA657" opacity="0.85"/>

            <!-- Body -->
            <rect x="148" y="148" width="44" height="40" rx="13" fill="#E6EDF3" stroke="#8B949E" stroke-width="1.5"/>

            <!-- Arms -->
            <rect x="133" y="153" width="18" height="10" rx="5" fill="#E6EDF3" stroke="#8B949E" stroke-width="1.5" transform="rotate(-18 142 158)"/>
            <rect x="189" y="153" width="18" height="10" rx="5" fill="#E6EDF3" stroke="#8B949E" stroke-width="1.5" transform="rotate(18  198 158)"/>
            <!-- Gloves -->
            <circle cx="130" cy="162" r="5.5" fill="#FF4433"/>
            <circle cx="210" cy="162" r="5.5" fill="#FF4433"/>

            <!-- Legs -->
            <rect x="156" y="185" width="11" height="19" rx="5" fill="#E6EDF3" stroke="#8B949E" stroke-width="1.5"/>
            <rect x="173" y="185" width="11" height="19" rx="5" fill="#E6EDF3" stroke="#8B949E" stroke-width="1.5"/>
            <!-- Boots -->
            <rect x="153" y="199" width="16" height="8" rx="4" fill="#262D37"/>
            <rect x="171" y="199" width="16" height="8" rx="4" fill="#262D37"/>

            <!-- Helmet shell -->
            <circle cx="170" cy="128" r="29" fill="#E6EDF3" stroke="#8B949E" stroke-width="1.5"/>
            <!-- Visor -->
            <ellipse cx="170" cy="128" rx="20" ry="19" fill="url(#visorGrad)" stroke="#262D37" stroke-width="1"/>
            <!-- Visor glare -->
            <ellipse id="visorGlare" cx="161" cy="121" rx="6.5" ry="4" fill="white" opacity="0.45" transform="rotate(-22 161 121)"/>
            <!-- Eyes -->
            <circle cx="163" cy="128" r="3.2" fill="#0E1116"/>
            <circle cx="177" cy="128" r="3.2" fill="#0E1116"/>
            <circle cx="164" cy="127" r="1.1" fill="white" opacity="0.65"/>
            <circle cx="178" cy="127" r="1.1" fill="white" opacity="0.65"/>
            <!-- Worried mouth -->
            <path d="M162 137 Q170 133 178 137" stroke="#0E1116" stroke-width="1.5" fill="none" stroke-linecap="round"/>
            <!-- Helmet accent stripe -->
            <path d="M142 123 Q170 106 198 123" stroke="#FF4433" stroke-width="2.5" fill="none" stroke-linecap="round"/>

            <!-- Chest badge -->
            <rect x="160" y="158" width="20" height="14" rx="3" fill="#161B22" stroke="#262D37" stroke-width="1"/>
            <text x="170" y="168" font-family="JetBrains Mono,monospace" font-size="5.5" fill="#3FB950" text-anchor="middle" font-weight="700">404</text>
          </g>

          <!-- ── Satellite (orbiting) ── -->
          <g id="satellite">
            <line x1="170" y1="128" x2="240" y2="72" stroke="#262D37" stroke-width="1" stroke-dasharray="3 3"/>
            <g transform="translate(240,68)">
              <rect x="-7" y="-5" width="14" height="10" rx="2.5" fill="#1C232C" stroke="#FF4433" stroke-width="1.2"/>
              <rect x="-19" y="-4" width="10" height="8" rx="1.5" fill="#79C0FF" opacity="0.8"/>
              <rect x="9"   y="-4" width="10" height="8" rx="1.5" fill="#79C0FF" opacity="0.8"/>
              <line x1="0" y1="-5" x2="0" y2="-11" stroke="#8B949E" stroke-width="1.2"/>
              <circle id="antennaDot" cx="0" cy="-13" r="2" fill="#FF4433" filter="url(#glow)"/>
            </g>
          </g>

          <!-- Glitch label -->
          <g id="glitchTxt">
            <text x="170" y="62" font-family="JetBrains Mono,monospace" font-size="10.5"
                  fill="#FF4433" text-anchor="middle" font-weight="700" opacity="0.65">
              // PAGE_NOT_FOUND
            </text>
          </g>

        </svg>
      </div>

      <!-- ═══════════════ RIGHT — Content ═══════════════ -->
      <div class="col-right">

        <div class="error-label">
          <span class="status-dot"></span>
          HTTP ERROR
        </div>

        <span class="error-code">404</span>

        <h1>Lost in Space 🚀</h1>

        <p class="subtitle">
          The page you're looking for drifted off into the void.<br>
          It may have been moved, deleted, or never existed.
        </p>

        <div class="json-card">
          <span class="jp">{</span><br>
          &nbsp;&nbsp;<span class="jk">"status"</span><span class="jp">:</span> <span class="jn">404</span><span class="jp">,</span><br>
          &nbsp;&nbsp;<span class="jk">"error"</span><span class="jp">:</span> <span class="js">"page_not_found"</span><span class="jp">,</span><br>
          &nbsp;&nbsp;<span class="jk">"message"</span><span class="jp">:</span> <span class="js">"This route does not exist"</span><span class="jp">,</span><br>
          &nbsp;&nbsp;<span class="jk">"suggestion"</span><span class="jp">:</span> <span class="js">"Try going back home"</span><br>
          <span class="jp">}</span>
        </div>

        <div class="btn-row">
          <a href="index.html" class="btn btn-primary">← Back Home</a>
          <a href="javascript:history.back()" class="btn btn-outline">↩ Go Back</a>
        </div>

      </div>

    </div>
  </div>

  <script>
    (function () {
      var c = document.getElementById('particles');
      var colors = ['#FF4433','#79C0FF','#3FB950','#FFA657','#E6EDF3'];
      for (var i = 0; i < 20; i++) {
        var d = document.createElement('div');
        d.className = 'particle';
        var s = Math.random() * 5 + 3;
        d.style.cssText =
          'width:'+ s +'px;height:'+ s +'px;' +
          'left:'+ (Math.random()*100) +'%;' +
          'background:'+ colors[Math.floor(Math.random()*5)] +';' +
          'animation-duration:'+ (Math.random()*12+8) +'s;' +
          'animation-delay:'  + (Math.random()*10)    +'s;';
        c.appendChild(d);
      }
    })();
  </script>

</body>
</html>
